# Purpose: Run the dependency-free engine and PWA startup contract tests on pushes and pull requests.
name: Engine contract tests

on:
  push:
    paths:
      - 'tests/**'
      - 'script.js'
      - 'engines/**'
      - 'index.html'
      - 'build.js'
      - 'sw.js'
      - 'manifest.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tests/**'
      - 'script.js'
      - 'engines/**'
      - 'index.html'
      - 'build.js'
      - 'sw.js'
      - 'manifest.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  engine-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run contract tests
        run: node --test tests/*.test.js
